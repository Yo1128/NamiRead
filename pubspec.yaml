name: namiread
description: "NamiRead 本地小说与电子书阅读器"
publish_to: 'none'
version: 0.5.5+17

environment:
  sdk: ^3.13.5

dependencies:
  flutter_localizations:
    sdk: flutter
  archive: ^4.7.1
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  html: ^0.15.7
  path: ^1.9.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  xml: ^7.1.0
  json_path: ^0.9.0
  flutter_qjs_next: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/reader/
    - assets/samples/
    - assets/fonts/MiSans-License.txt
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-VF.ttf
